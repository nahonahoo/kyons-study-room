.ln-tbl { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.9; margin: 10px 0; }

.ln-frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }

.qd-step summary { cursor: pointer; padding: 12px 14px; font-size: 16px; font-weight: bold; color: var(--gold); line-height: 1.7; }
.qd-step[open] summary { border-bottom: 1px solid var(--border); }
.qd-body { padding: 12px 16px; font-size: 16px; line-height: 2.1; }
.qd-big { font-size: 19px; font-weight: bold; color: #fff; background: rgba(255,216,77,0.12); border-left: 4px solid var(--gold); padding: 6px 12px; margin: 8px 0; border-radius: 6px; }
.ln-figs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.ln-figs > div { text-align: center; font-size: 15px; line-height: 1.7; }
.ln-qsvg { margin: 8px 0 12px; }
