.exp-ok, .exp-ng { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; line-height: 1.9; margin: 4px 2px; }
.exp-tip { font-size: 14px; line-height: 1.9; }
.word-chip { background: var(--bg3, #1c2230); border: 1px solid var(--border, #30363d); border-radius: 8px; padding: 6px 14px; font-family: Georgia, serif; font-size: 16px; color: var(--gold, #f5c518); }
