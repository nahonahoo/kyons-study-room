<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社会｜歴史ストーリー新聞 飛鳥時代</title>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/social.css">
<style>
/* ===== POP広告デザイン（ストーリー新聞シリーズ） ===== */
:root{
  --ink:#1a1a1a;
  --pop-y:#ffe14d; --pop-p:#ff5ca8; --pop-c:#29c5f6; --pop-g:#3ddc84; --pop-o:#ff8a1f; --pop-v:#9b6bff; --pop-r:#ff3b3b;
  --paper:#fff6d5;
}
body{
  background-color:var(--paper);
  background-image:radial-gradient(rgba(255,138,31,0.18) 2.5px, transparent 2.5px);
  background-size:26px 26px;
  color:var(--ink);
  font-family:'M PLUS Rounded 1c','Noto Serif JP',sans-serif;
}
.pop{ font-family:'Mochiy Pop One','M PLUS Rounded 1c',sans-serif; font-weight:400; }
.paper-main{ max-width:780px; margin:0 auto; padding:20px 14px 70px; }

/* ---- 見出し（マストヘッド） ---- */
.masthead{ text-align:center; padding:18px 6px 10px; position:relative; }
.burst{ display:inline-flex; align-items:center; justify-content:center; width:112px; height:112px; background:var(--pop-r); color:#fff;
  clip-path:polygon(50% 0%,61% 12%,76% 5%,79% 21%,95% 22%,89% 37%,100% 50%,89% 63%,95% 78%,79% 79%,76% 95%,61% 88%,50% 100%,39% 88%,24% 95%,21% 79%,5% 78%,11% 63%,0% 50%,11% 37%,5% 22%,21% 21%,24% 5%,39% 12%);
  font-family:'Mochiy Pop One',sans-serif; font-size:22px; line-height:1.15; transform:rotate(-10deg); text-align:center; }
.masthead .burst{ position:absolute; top:-6px; left:0; z-index:2; }
.masthead-title{ font-family:'Mochiy Pop One',sans-serif; font-size:40px; line-height:1.35; color:#fff; letter-spacing:2px; margin-top:26px;
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),6px 6px 0 var(--pop-p); }
.masthead-title .t1{ color:var(--pop-y); }
.masthead-title .t2{ color:var(--pop-c); }
.masthead-sub{ display:inline-block; margin-top:12px; background:#fff; border:3px solid var(--ink); border-radius:30px; padding:6px 18px; font-size:15px; font-weight:800; line-height:1.8; box-shadow:4px 4px 0 var(--ink); }
.series{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0 4px; font-size:13px; font-weight:800; }
.series a, .series span{ padding:5px 12px; border-radius:20px; border:2.5px solid var(--ink); color:var(--ink); text-decoration:none; background:#fff; box-shadow:2px 2px 0 var(--ink); }
.series .now{ background:var(--pop-y); }
.series a{ background:var(--pop-c); }
.series .soon{ opacity:0.45; box-shadow:none; }

/* ---- 吹き出しキャッチ ---- */
.catch{ position:relative; background:var(--pop-y); border:4px solid var(--ink); border-radius:24px; padding:18px 20px; margin:24px 0 30px; font-size:19px; font-weight:900; line-height:1.9; box-shadow:6px 6px 0 var(--ink); }
.catch::after{ content:''; position:absolute; bottom:-22px; left:60px; border-width:22px 16px 0 16px; border-style:solid; border-color:var(--ink) transparent transparent transparent; }
.catch small{ display:block; font-size:14px; font-weight:700; margin-top:6px; }

/* ---- セクション見出し（リボン） ---- */
.sec-head{ margin:40px 0 16px; text-align:left; }
.sec-head span{ display:inline-block; font-family:'Mochiy Pop One',sans-serif; font-size:20px; color:#fff; background:var(--pop-p); border:3px solid var(--ink); border-radius:10px; padding:6px 18px; box-shadow:4px 4px 0 var(--ink); transform:rotate(-2deg); text-shadow:2px 2px 0 var(--ink); }
.sec-head.c span{ background:var(--pop-c); }
.sec-head.g span{ background:var(--pop-g); }
.sec-head.o span{ background:var(--pop-o); }
.sec-head.v span{ background:var(--pop-v); }

/* ---- キャラ図鑑 ---- */
.chara-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.chara{ border:3px solid var(--ink); border-radius:16px; padding:14px; box-shadow:5px 5px 0 var(--ink); background:#fff; }
.chara.k0{ background:#fff3b0; } .chara.k1{ background:#ffd6ea; } .chara.k2{ background:#cdf0ff; } .chara.k3{ background:#d4f9e4; } .chara.k4{ background:#ffe0c2; } .chara.k5{ background:#e6dcff; }
.chara-top{ display:flex; align-items:center; gap:10px; }
.chara-emo{ width:48px; height:48px; border-radius:50%; background:#fff; border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0; }
.chara-name{ font-family:'Mochiy Pop One',sans-serif; font-size:18px; line-height:1.4; }
.chara-name small{ display:block; font-family:'M PLUS Rounded 1c',sans-serif; font-size:12px; font-weight:700; color:#555; }
.chara-desc{ font-size:15px; font-weight:700; line-height:1.95; margin-top:8px; }

/* ---- 年表 ---- */
.tl{ background:#fff; border:3px solid var(--ink); border-radius:16px; padding:16px 14px 6px; box-shadow:5px 5px 0 var(--ink); }
.tl-item{ display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; font-size:16px; font-weight:700; line-height:1.8; }
.tl-year{ flex-shrink:0; min-width:64px; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:1px; border:2.5px solid var(--ink); border-radius:20px; padding:0 8px; background:var(--pop-y); }
.tl-item:nth-child(3n+2) .tl-year{ background:var(--pop-c); }
.tl-item:nth-child(3n) .tl-year{ background:var(--pop-p); color:#fff; text-shadow:1px 1px 0 var(--ink); }

/* ---- 記事カード ---- */
.clip-card{ position:relative; background:#fff; border:4px solid var(--ink); border-radius:18px; padding:30px 18px 20px; margin:26px 0 10px; box-shadow:7px 7px 0 var(--ink); }
.clip-card::before{ content:''; position:absolute; left:0; right:0; top:0; height:14px; border-radius:14px 14px 0 0; background:var(--band, var(--pop-y)); border-bottom:3px solid var(--ink); }
.clip-head{ display:flex; align-items:center; gap:14px; margin:6px 0 14px; }
.clip-num{ flex-shrink:0; width:64px; height:64px; display:flex; align-items:center; justify-content:center; background:var(--band, var(--pop-y)); font-family:'Mochiy Pop One',sans-serif; font-size:26px; color:var(--ink);
  clip-path:polygon(50% 0%,61% 12%,76% 5%,79% 21%,95% 22%,89% 37%,100% 50%,89% 63%,95% 78%,79% 79%,76% 95%,61% 88%,50% 100%,39% 88%,24% 95%,21% 79%,5% 78%,11% 63%,0% 50%,11% 37%,5% 22%,21% 21%,24% 5%,39% 12%); }
.clip-title{ font-family:'Mochiy Pop One',sans-serif; font-size:20px; line-height:1.55; }
.clip-body{ font-size:17px; font-weight:700; line-height:2.05; padding:0; margin:0; }
.clip-body li{ list-style:none; margin-bottom:12px; padding-left:30px; position:relative; }
.clip-body li::before{ content:'★'; position:absolute; left:2px; top:0; font-size:18px; color:var(--band, var(--pop-o)); -webkit-text-stroke:1px var(--ink); }

/* ---- 強調（明るい紙の上：はっきりした蛍光ペン色の帯を文字の下側だけに引く） ---- */
.hl, .hl-red, .hl-blue{ font-weight:900; padding:0 2px; background-repeat:no-repeat; background-size:100% 38%; background-position:0 100%; }
.hl{ color:var(--ink); background-image:linear-gradient(#ffe600, #ffe600); }
.hl-red{ color:#e8002d; background-image:linear-gradient(#ffb8d2, #ffb8d2); }
.hl-blue{ color:#0057d9; background-image:linear-gradient(#a8e4ff, #a8e4ff); }
.big{ font-size:21px; }

/* ---- 会話（キャラ別の吹き出し） ---- */
.talk{ margin:18px 0 6px; padding:14px 10px 4px; border:3px dashed #bbb; border-radius:16px; background:#fffdf3; }
.talk .chat-line{ margin-bottom:12px; }
.talk .avatar{ width:44px; height:44px; font-size:20px; border:3px solid var(--ink); color:var(--ink); }
.top-nav{ background:var(--pop-p); border-bottom:4px solid var(--ink); }
.nav-title{ font-family:'Mochiy Pop One',sans-serif; color:#fff; text-shadow:2px 2px 0 var(--ink); letter-spacing:1px; }
.talk .chat-name{ font-size:12px; font-weight:800; color:#555; }
.talk .chat-bubble{ position:relative; font-size:16px; font-weight:700; line-height:1.95; color:var(--ink); border:3px solid var(--ink); border-radius:16px; box-shadow:3px 3px 0 var(--ink); background:#fff; }
.talk .av-kyon{ background:#ffb3c7; } .b-kyon{ background:#ffe3ec !important; }
.talk .av-nishi{ background:#b9dcff; font-size:14px; } .b-nishi{ background:#e3f1ff !important; }
.talk .av-shun{ background:#d9c8ff; } .b-shun{ background:#efe7ff !important; }
.talk .av-kuruma{ background:#b8f2cf; } .b-kuruma{ background:#e2fbec !important; }
.talk .av-iwakura{ background:#ffd0a3; } .b-iwakura{ background:#fff0e0 !important; }

/* ---- 語呂合わせ（付箋） ---- */
.goro{ position:relative; margin:22px 4px 6px; padding:18px 16px 12px; background:#fff59d; border:3px solid var(--ink); border-radius:6px; font-size:16px; font-weight:800; line-height:2; box-shadow:4px 4px 0 var(--ink); }
.goro::before{ content:'🎵 語呂合わせ'; position:absolute; top:-15px; left:14px; font-family:'Mochiy Pop One',sans-serif; font-size:13px; background:var(--pop-v); color:#fff; border:2.5px solid var(--ink); border-radius:8px; padding:1px 10px; transform:rotate(-3deg); }
.goro b{ color:#e8002d; font-size:18px; }

/* ---- ココ出る!!／つづく!!／注意!! の札 ---- */
.pop-point{ position:relative; margin:26px 0 4px; padding:22px 16px 14px; border:3px solid var(--ink); border-radius:14px; font-size:16px; font-weight:900; line-height:1.95; box-shadow:5px 5px 0 var(--ink); background:#ffe9ef; }
.pop-point.next{ background:#e3f5ff; }
.pop-point.warn{ background:#fff0d6; }
.pop-tag{ position:absolute; top:-18px; left:12px; font-family:'Mochiy Pop One',sans-serif; font-size:16px; color:#fff; background:var(--pop-r); border:3px solid var(--ink); border-radius:10px; padding:2px 14px; transform:rotate(-4deg); text-shadow:1px 1px 0 var(--ink); }
.pop-point.next .pop-tag{ background:var(--pop-c); }
.pop-point.warn .pop-tag{ background:var(--pop-o); }

.arrow-down{ text-align:center; font-size:34px; line-height:1; margin:12px 0 6px; animation:bob 1.2s ease-in-out infinite; }
@keyframes bob{ 50%{ transform:translateY(6px); } }

/* ---- 1行まとめ ---- */
.oneline{ background:var(--pop-c); border:4px solid var(--ink); border-radius:18px; padding:18px; font-size:17px; font-weight:900; line-height:2.1; box-shadow:6px 6px 0 var(--ink); }
.oneline .hl{ background-image:linear-gradient(#fff, #fff); }

/* ---- 勘違い ---- */
.myth{ display:flex; gap:12px; align-items:flex-start; background:#fff; border:3px solid var(--ink); border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:16px; font-weight:700; line-height:1.9; box-shadow:4px 4px 0 var(--ink); }
.stamp{ flex-shrink:0; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Mochiy Pop One',sans-serif; font-size:18px; color:#fff; border:3px solid var(--ink); }
.stamp.ng{ background:var(--pop-r); }
.myth .ng-text{ color:#888; text-decoration:line-through; text-decoration-color:var(--pop-r); text-decoration-thickness:3px; }
.myth .ok-text{ display:block; margin-top:4px; }
.myth .ok-text::before{ content:'⭕ '; }

/* ---- 組み合わせ表 ---- */
.pair-wrap{ overflow-x:auto; border:3px solid var(--ink); border-radius:14px; box-shadow:5px 5px 0 var(--ink); background:#fff; }
.pair-table{ width:100%; border-collapse:collapse; font-size:15px; font-weight:700; line-height:1.8; }
.pair-table th, .pair-table td{ border-bottom:2px solid #ddd; padding:8px 10px; vertical-align:top; text-align:left; }
.pair-table th{ background:var(--pop-y); font-family:'Mochiy Pop One',sans-serif; font-weight:400; border-bottom:3px solid var(--ink); }
.pair-table tr:nth-child(even) td{ background:#fff9e3; }

/* ---- 3秒チェック ---- */
.flip{ background:#fff; border:3px solid var(--ink); border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:16px; font-weight:700; line-height:1.9; box-shadow:4px 4px 0 var(--ink); }
.flip-q{ display:inline-block; font-family:'Mochiy Pop One',sans-serif; background:var(--pop-v); color:#fff; border-radius:8px; padding:0 8px; margin-right:6px; font-size:14px; }
.flip-btn{ margin-top:8px; background:var(--pop-y); border:3px solid var(--ink); color:var(--ink); padding:6px 18px; border-radius:22px; font-size:15px; font-family:'Mochiy Pop One',sans-serif; cursor:pointer; box-shadow:3px 3px 0 var(--ink); }
.flip-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.flip-ans{ display:none; margin-top:8px; font-size:17px; font-weight:900; color:#e8002d; }

.end-note{ text-align:center; margin-top:36px; padding:18px; background:#fff; border:3px dashed var(--ink); border-radius:16px; font-size:14px; font-weight:700; line-height:1.9; }

@media (max-width:600px){
  .masthead-title{ font-size:30px; }
  .masthead .burst{ width:84px; height:84px; font-size:17px; top:-10px; }
  .clip-title{ font-size:18px; }
  .sec-head span{ font-size:16px; padding:6px 14px; }
  .clip-num{ width:54px; height:54px; font-size:22px; }
}
</style>
</head>
