<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語で学ぶお笑い理論</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --card: #0f3460;
      --text: #e0e0e0;
      --muted: #888;
      --radius: 12px;
      --gold: #f7c948;
      --green: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --purple: #7c3aed;
      --eng-font: 'Times New Roman', Georgia, serif;
      --jp-font: 'Noto Serif JP', 'Georgia', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--jp-font);
      min-height: 100vh;
    }

    /* ── ARTIST SELECT SCREEN ── */
    #artist-screen {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }
    .as-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 560px; width: 92%;
      text-align: center;
      box-shadow: 0 0 60px rgba(0,0,0,.6);
    }
    .as-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; color: var(--gold); }
    .as-sub { font-size: .9rem; color: var(--muted); margin-bottom: 28px; }
    .as-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .as-btn {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: var(--radius);
      padding: 14px 8px;
      cursor: pointer;
      color: var(--text);
      font-family: var(--jp-font);
      font-size: .85rem;
      transition: all .15s;
    }
    .as-btn:hover { border-color: var(--gold); background: rgba(247,201,72,.1); }
    .as-icon { font-size: 1.6rem; margin-bottom: 4px; }

    /* ── HEADER ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }
    header {
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 14px 20px;
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 10px;
      margin-bottom: 12px;
    }
    .header-title { font-size: 1.1rem; font-weight: 700; color: var(--gold); }
    .artist-badge {
      display: flex; align-items: center; gap: 8px;
      background: var(--card);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: .82rem;
    }
    .artist-badge button {
      background: none; border: none; color: var(--muted);
      font-size: .75rem; cursor: pointer; padding: 0;
      font-family: var(--jp-font);
      text-decoration: underline;
    }
    .text-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 99px;
      padding: 7px 18px;
      color: var(--muted);
      font-family: var(--jp-font);
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
    }
    .tab-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(247,201,72,.1); }
    .tab-btn:hover:not(.active) { border-color: rgba(255,255,255,.2); color: var(--text); }

    /* ── MAIN LAYOUT ── */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; }
    }

    /* ── TEXT PANEL ── */
    #text-panel {
      padding: 24px 20px;
      overflow-y: auto;
      border-right: 1px solid rgba(255,255,255,.06);
      max-height: calc(100vh - 120px);
    }
    @media (max-width: 768px) {
      #text-panel { max-height: 45vh; border-right: none; border-bottom: 1px solid rgba(255,255,255,.06); }
    }
    .text-title {
      font-family: var(--eng-font);
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 18px;
      font-style: italic;
    }
    .text-body {
      font-family: var(--eng-font);
      font-size: 1.125rem;
      line-height: 2.0;
      letter-spacing: 0.03em;
      color: #d4d4d4;
    }
    .text-body .speaker {
      color: var(--gold);
      font-weight: bold;
    }
    .text-body .stage-dir {
      color: var(--muted);
      font-style: italic;
    }
    .text-body p { margin-bottom: 6px; }
    .text-line { display: block; }
    .highlight-line {
      background: rgba(247,201,72,.15);
      border-left: 3px solid var(--gold);
      padding-left: 8px;
      border-radius: 2px;
    }

    /* ── MEMO SECTION ── */
    .memo-section {
      margin-top: 4px;
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 16px;
    }
    .memo-label {
      font-family: var(--jp-font);
      font-size: .85rem;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .memo-textarea {
      width: 100%;
      background: #0a0a1a;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      padding: 12px 14px;
      color: #c8c8d8;
      font-family: var(--jp-font);
      font-size: .88rem;
      line-height: 1.7;
      resize: vertical;
      outline: none;
      transition: border-color .15s;
      min-height: 100px;
    }
    .memo-textarea:focus { border-color: rgba(247,201,72,.4); }
    .memo-textarea::placeholder { color: rgba(255,255,255,.2); }
    .memo-clear-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .memo-clear-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--muted);
      font-family: var(--jp-font);
      font-size: .75rem;
      cursor: pointer;
      transition: all .15s;
    }
    .memo-clear-btn:hover { border-color: var(--red); color: var(--red); }

    /* ── QUESTION PANEL ── */
    #question-panel {
      padding: 24px 20px;
      overflow-y: auto;
      max-height: calc(100vh - 120px);
      display: flex; flex-direction: column; gap: 16px;
    }
    @media (max-width: 768px) {
      #question-panel { max-height: none; }
    }

    /* Progress */
    .progress-bar-wrap { background: rgba(255,255,255,.08); border-radius: 99px; height: 6px; }
    .progress-bar-fill { height: 100%; border-radius: 99px; background: var(--gold); transition: width .3s; }
    .progress-label { font-size: .78rem; color: var(--muted); margin-top: 4px; }

    /* Question card */
    .q-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .q-type-badge {
      display: inline-block;
      font-size: .72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 12px;
      letter-spacing: .04em;
    }
    .badge-vocab    { background: rgba(59,130,246,.25); color: #93c5fd; }
    .badge-fill     { background: rgba(124,58,237,.25); color: #c4b5fd; }
    .badge-tf       { background: rgba(16,185,129,.25); color: #6ee7b7; }
    .badge-translate { background: rgba(236,72,153,.25); color: #f9a8d4; }

    .q-text {
      font-size: 1rem;
      line-height: 1.75;
      letter-spacing: 0.02em;
      margin-bottom: 14px;
    }
    .q-text .jp { font-family: var(--jp-font); }
    .q-text .en { font-family: var(--eng-font); font-size: 1.05rem; }
    .q-blank { color: var(--gold); font-weight: bold; }

    .q-input {
      width: 100%;
      background: var(--card);
      border: 2px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--eng-font);
      font-size: 1rem;
      outline: none;
      transition: border-color .15s;
    }
    .q-input:focus { border-color: var(--gold); }
    .q-input.correct { border-color: var(--green); background: rgba(16,185,129,.1); }
    .q-input.incorrect { border-color: var(--red); background: rgba(239,68,68,.1); }
    .q-input:disabled { opacity: .6; }

    .q-btns { display: flex; gap: 8px; margin-top: 12px; }
    .btn-answer {
      background: var(--gold);
      color: #111;
      border: none;
      border-radius: 8px;
      padding: 11px 22px;
      font-family: var(--jp-font);
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-answer:hover { opacity: .85; }
    .btn-skip {
      background: transparent;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      padding: 11px 16px;
      color: var(--muted);
      font-family: var(--jp-font);
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-skip:hover { border-color: rgba(255,255,255,.3); color: var(--text); }

    /* Feedback */
    .feedback {
      margin-top: 12px;
      border-radius: 10px;
      padding: 14px 16px;
      display: none;
    }
    .feedback.correct-fb {
      background: rgba(16,185,129,.12);
      border: 1px solid rgba(16,185,129,.3);
    }
    .feedback.wrong-fb {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
    }
    .fb-result { font-size: 1rem; font-weight: 700; margin-bottom: 8px; }
    .fb-correct .fb-result { color: var(--green); }
    .fb-wrong   .fb-result { color: var(--red); }

    .artist-comment {
      display: flex; align-items: flex-start; gap: 12px;
      background: rgba(255,255,255,.04);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
    }
    .ac-icon { font-size: 1.8rem; flex-shrink: 0; }
    .ac-name { font-size: .75rem; color: var(--muted); margin-bottom: 3px; }
    .ac-line { font-size: .95rem; line-height: 1.5; }

    /* ── EXPLANATION BOX ── */
    .explanation-box {
      margin-top: 12px;
      background: #1e2a45;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px;
      padding: 14px 16px;
      animation: fadeInUp .3s ease;
    }
    .explanation-header {
      display: flex; align-items: center; gap: 8px;
      font-size: .8rem;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      letter-spacing: .05em;
    }
    .explanation-divider {
      color: rgba(255,255,255,.2);
      font-size: .7rem;
    }
    .explanation-body {
      font-family: var(--jp-font);
      font-size: .875rem;
      line-height: 1.8;
      color: #c8d8f0;
      white-space: pre-line;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hint-box {
      background: rgba(255,255,255,.04);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: .88rem;
      color: #c0c0c0;
    }
    .hint-box .hint-label { color: var(--gold); font-weight: 600; font-size: .8rem; margin-bottom: 4px; }

    .btn-next {
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: var(--jp-font);
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity .15s;
    }
    .btn-next:hover { opacity: .85; }

    /* Complete screen */
    #complete-screen {
      display: none;
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px 24px;
      margin: 20px;
    }
    .cs-title { font-size: 1.5rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
    .cs-score { font-size: 3rem; font-weight: 700; margin: 16px 0; }
    .cs-msg { color: var(--muted); margin-bottom: 24px; }
    .cs-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .cs-btn {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      padding: 12px 24px;
      color: var(--text);
      font-family: var(--jp-font);
      cursor: pointer;
      transition: all .15s;
    }
    .cs-btn:hover { border-color: var(--gold); color: var(--gold); }
    .cs-btn.primary { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 700; }
    .cs-btn.primary:hover { opacity: .85; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

    /* ── STUDY OVERLAY ── */
    #study-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
    }
    #mode-screen {
      text-align: center;
      max-width: 480px;
      width: 100%;
      margin: auto;
    }
    .mode-text-title {
      font-size: 1.05rem;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .mode-subtitle {
      font-size: .9rem;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .mode-studied-badge {
      display: inline-block;
      background: rgba(16,185,129,.18);
      color: var(--green);
      border-radius: 99px;
      padding: 5px 16px;
      font-size: .8rem;
      margin-bottom: 20px;
    }
    .mode-btns { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .mode-btn-primary {
      background: var(--gold); color: #111;
      border: none; border-radius: var(--radius);
      padding: 18px 24px;
      font-family: var(--jp-font); font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
    }
    .mode-btn-primary:hover { opacity: .85; }
    .mode-btn-secondary {
      background: var(--card); color: var(--text);
      border: 1px solid rgba(255,255,255,.15); border-radius: var(--radius);
      padding: 18px 24px;
      font-family: var(--jp-font); font-size: 1.05rem; font-weight: 700;
      cursor: pointer; transition: all .15s;
    }
    .mode-btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
    .mode-skip-link {
      font-size: .8rem; color: var(--muted);
      cursor: pointer; text-decoration: underline;
      background: none; border: none; font-family: var(--jp-font);
    }
    .mode-skip-link:hover { color: var(--text); }
    .tab-btn.studied::after { content: ' ✓'; color: var(--green); font-size: .72rem; }

    /* Flashcard */
    #fc-screen {
      width: 100%; max-width: 560px; margin: auto;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .fc-progress-wrap { width: 100%; text-align: center; }
    .fc-progress-label {
      font-size: .9rem; color: var(--muted);
      margin-bottom: 8px; letter-spacing: .05em;
    }
    .fc-bar-bg { background: rgba(255,255,255,.08); border-radius: 99px; height: 7px; }
    .fc-bar-fill { height: 100%; border-radius: 99px; background: var(--gold); transition: width .35s; }
    .flashcard {
      background: #0f1c3a;
      border: 2px solid rgba(247,201,72,.25);
      border-radius: 20px;
      padding: 40px 32px 32px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    .fc-speak-top { display: flex; justify-content: center; margin-bottom: 28px; }
    .fc-speak-btn {
      background: rgba(247,201,72,.12);
      border: 2px solid rgba(247,201,72,.4);
      border-radius: 50%;
      width: 62px; height: 62px;
      font-size: 1.6rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s;
    }
    .fc-speak-btn:hover { background: rgba(247,201,72,.28); }
    .fc-word {
      font-family: var(--eng-font);
      font-size: 3rem; font-weight: bold; color: #fff;
      letter-spacing: 0.1em; margin-bottom: 10px; line-height: 1.1;
    }
    .fc-kana {
      font-size: 1.3rem; color: rgba(255,255,255,.42);
      letter-spacing: 0.15em; margin-bottom: 18px;
    }
    .fc-divider { width: 60px; height: 2px; background: rgba(247,201,72,.3); margin: 0 auto 18px; }
    .fc-jp {
      font-family: var(--jp-font);
      font-size: 2rem; color: #e8d88a;
      letter-spacing: 0.08em; line-height: 1.4;
    }
    .fc-prompt { font-size: .82rem; color: rgba(255,255,255,.3); margin-top: 20px; letter-spacing: .06em; }
    .fc-actions { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .fc-next-btn {
      background: var(--gold); color: #111;
      border: none; border-radius: var(--radius);
      padding: 16px 40px;
      font-family: var(--jp-font); font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: opacity .15s;
      width: 100%; max-width: 360px;
    }
    .fc-next-btn:hover { opacity: .85; }
    .fc-again-btn {
      background: none; border: none;
      color: var(--muted); font-family: var(--jp-font);
      font-size: .82rem; cursor: pointer; text-decoration: underline;
    }
    .fc-again-btn:hover { color: var(--text); }

    /* Grammar card */
    #fc-grammar-card {
      background: #0d1f3a;
      border: 2px solid rgba(59,130,246,.35);
      border-radius: 20px;
      padding: 32px 28px;
      width: 100%; text-align: left;
      box-shadow: 0 8px 40px rgba(0,0,0,.5);
    }
    .gc-badge {
      display: inline-block;
      background: rgba(59,130,246,.2); color: #93c5fd;
      border-radius: 99px; padding: 4px 14px;
      font-size: .78rem; font-weight: 700;
      margin-bottom: 16px; letter-spacing: .05em;
    }
    .gc-title {
      font-size: 1.05rem; font-weight: 700; color: #fff;
      margin-bottom: 16px; font-family: var(--jp-font);
    }
    .gc-example-en {
      font-family: var(--eng-font); font-size: 1rem;
      color: var(--gold); margin-bottom: 4px; font-style: italic;
    }
    .gc-arrow { color: var(--muted); font-size: .82rem; margin-bottom: 4px; }
    .gc-translate {
      font-family: var(--jp-font); font-size: .9rem;
      color: #c8d8f0; margin-bottom: 14px;
    }
    .gc-point {
      font-family: var(--jp-font); font-size: .85rem;
      color: var(--green); margin-bottom: 14px; font-weight: 700;
    }
    .gc-examples {
      font-family: var(--jp-font); font-size: .85rem;
      color: #c0cce0; line-height: 2.0; white-space: pre-line;
    }
    .gc-en { font-family: var(--eng-font); color: #93c5fd; }
  </style>
</head>
<body>

<!-- ══════════════════════ ARTIST SELECT SCREEN ══════════════════════ -->
<div id="artist-screen">
  <div class="as-card">
    <div class="as-title">📖 英語で学ぶお笑い理論</div>
    <div class="as-sub">好きな芸人を選んでね！正解したらひとことコメントしてくれるよ</div>
    <div class="as-grid" id="artist-grid"></div>
  </div>
</div>

<!-- ══════════════════════ MAIN APP ══════════════════════ -->
<div id="app">
  <header>
    <div class="header-top">
      <div class="header-title">📖 英語で学ぶお笑い理論</div>
      <div class="artist-badge">
        <span id="current-artist-label">芸人を選んでください</span>
        <button onclick="resetArtist()">変える</button>
      </div>
    </div>
    <div class="text-tabs" id="text-tabs"></div>
  </header>

  <main>
    <div id="text-panel">
      <div class="text-title" id="text-title"></div>
      <div class="text-body" id="text-body"></div>
    </div>

    <div id="question-panel">
      <div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
        <div class="progress-label" id="progress-label">問題 0/0</div>
      </div>

      <div class="q-card" id="q-card">
        <div class="q-type-badge" id="q-type-badge"></div>
        <div class="q-text" id="q-text"></div>
        <input class="q-input" id="q-input" type="text" placeholder="ここに入力…" autocomplete="off" autocorrect="off" spellcheck="false">
        <div class="q-btns">
          <button class="btn-answer" onclick="checkAnswer()">回答する</button>
          <button class="btn-skip" onclick="skipQuestion()">スキップ</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div id="complete-screen">
        <div class="cs-title">🎉 全問クリア！</div>
        <div class="cs-score" id="cs-score"></div>
        <div class="cs-msg" id="cs-msg"></div>
        <div class="cs-btns">
          <button class="cs-btn primary" onclick="retryText()">もう一度</button>
          <button class="cs-btn" onclick="nextText()">次のテキストへ</button>

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════

let selectedArtist = null;
let currentTextIdx = 0;
let questions       = [];
let currentQIdx     = 0;
let attempts        = 0;
let score           = 0;
let totalAnswered   = 0;

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════

function init() {
  // Build artist selection grid
  const grid = document.getElementById('artist-grid');
  ARTISTS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'as-btn';
    btn.innerHTML = `<div class="as-icon">${a.icon}</div><div>${a.name}</div>`;
    btn.onclick = () => selectArtist(a.id);
    grid.appendChild(btn);
  });

  // Build text tabs
  const tabs = document.getElementById('text-tabs');
  TEXTS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = `Text ${t.id}`;
    btn.dataset.idx = i;
    btn.onclick = () => selectText(i);
    tabs.appendChild(btn);
  });
}

function selectArtist(id) {
  selectedArtist = ARTISTS.find(a => a.id === id);
  document.getElementById('artist-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('current-artist-label').textContent =
    `${selectedArtist.icon} ${selectedArtist.name}`;
  showModeScreen(0);
}

function resetArtist() {
  document.getElementById('artist-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ══════════════════════════════════════════════
// TEXT & QUESTION LOADING
// ══════════════════════════════════════════════

function selectText(idx) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
  showModeScreen(idx);
}

function loadText(idx) {
  currentTextIdx = idx;
  const text = TEXTS[idx];

  // Render text
  document.getElementById('text-title').textContent = text.title;
  const body = document.getElementById('text-body');
  body.innerHTML = text.lines.map(l =>
    `<span class="text-line" id="tl-${l.id}">${l.html}</span><br>`
  ).join('');

  // Shuffle questions
  questions = shuffleArray([...text.questions]);
  currentQIdx  = 0;
  score        = 0;
  totalAnswered = 0;
  attempts     = 0;

  document.getElementById('complete-screen').style.display = 'none';
  document.getElementById('q-card').style.display = 'block';

  // Memo is preserved across text switches (do NOT clear textarea)

  showQuestion();
}

function showQuestion() {
  clearHighlight();
  if (currentQIdx >= questions.length) {
    showComplete();
    return;
  }

  const q = questions[currentQIdx];
  attempts = 0;

  // Progress
  const pct = Math.round((currentQIdx / questions.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label').textContent =
    `問題 ${currentQIdx + 1}/${questions.length}`;

  // Type badge
  const badge = document.getElementById('q-type-badge');
  const badgeMap = {
    vocab:     { cls: 'badge-vocab',     label: '📘 単語問題' },
    fill:      { cls: 'badge-fill',      label: '✏️ 空欄補充' },
    tf:        { cls: 'badge-tf',        label: '⭕ True / False' },
    translate: { cls: 'badge-translate', label: '🖊️ 英作文' }
  };
  badge.className = 'q-type-badge ' + badgeMap[q.type].cls;
  badge.textContent = badgeMap[q.type].label;

  // Question text
  const qText = document.getElementById('q-text');
  if (q.type === 'vocab') {
    qText.innerHTML = `<span class="jp">「${q.q}」を英語で書こう！</span>`;
  } else if (q.type === 'fill') {
    const formatted = q.q.replace('___', '<span class="q-blank">___</span>');
    qText.innerHTML = `<span class="en">${formatted}</span><br><span class="jp" style="font-size:.82rem;color:var(--muted)">（___に入る英語は？）</span>`;
  } else if (q.type === 'tf') {
    qText.innerHTML = `<span class="en">${q.q}</span><br><span class="jp" style="font-size:.82rem;color:var(--muted)">（true か false で答えよう）</span>`;
  } else if (q.type === 'translate') {
    qText.innerHTML = `<span class="jp">「${q.q}」</span><br><span class="jp" style="font-size:.82rem;color:var(--muted)">↑ これを英語に直そう</span>`;
  }

  // Reset input
  const inp = document.getElementById('q-input');
  inp.value = '';
  inp.className = 'q-input';
  inp.disabled = false;
  inp.placeholder = q.type === 'tf' ? 'true か false を入力…' : 'ここに入力…';
  inp.focus();

  // Hide feedback
  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.innerHTML = '';

  // Highlight relevant line for fill questions
  if (q.type === 'fill' && q.lineId) {
    highlightLine(q.lineId);
  }
}

// ══════════════════════════════════════════════
// ANSWER CHECKING
// ══════════════════════════════════════════════

function normalize(s) {
  return s.trim().toLowerCase().replace(/[.!?'"]/g, '').replace(/\s+/g, ' ');
}

function checkAnswer() {
  const q   = questions[currentQIdx];
  const inp = document.getElementById('q-input');
  const raw = inp.value;
  if (!raw.trim()) return;

  const correct = normalize(raw) === normalize(q.a);
  attempts++;

  if (correct) {
    inp.className = 'q-input correct';
    inp.disabled  = true;
    score++;
    totalAnswered++;
    showCorrectFeedback();
  } else {
    inp.className = 'q-input incorrect';
    totalAnswered++;
    showWrongFeedback();
  }
}

function skipQuestion() {
  totalAnswered++;
  showSkipFeedback();
}

function showCorrectFeedback() {
  const q  = questions[currentQIdx];
  const fb = document.getElementById('feedback');
  fb.className = 'feedback correct-fb';
  fb.style.display = 'block';

  // Pick random member and random comment
  const members = selectedArtist.members;
  const m = members[Math.floor(Math.random() * members.length)];
  const comment = m.comments[Math.floor(Math.random() * m.comments.length)];

  // Build explanation HTML
  let explanationHtml = '';
  if (q.explanation) {
    explanationHtml = `
      <div class="explanation-box">
        <div class="explanation-header">
          <span>📖</span>
          <span class="explanation-divider">━━━━━━━━━━━━━━━━━━━━</span>
          <span>解説</span>
          <span class="explanation-divider">━━━━━━━━━━━━━━━━━━━━</span>
        </div>
        <div class="explanation-body">${q.explanation.replace(/\n/g, '<br>')}</div>
      </div>`;
  }

  fb.innerHTML = `
    <div class="fb-correct">
      <div class="fb-result">✅ 正解！</div>
      <div class="artist-comment">
        <div class="ac-icon">${m.icon}</div>
        <div>
          <div class="ac-name">${selectedArtist.name} / ${m.name}</div>
          <div class="ac-line">${comment}</div>
        </div>
      </div>
      ${explanationHtml}
      <button class="btn-next" onclick="nextQuestion()">次の問題へ ▶</button>
    </div>
  `;
}

function showWrongFeedback() {
  const q   = questions[currentQIdx];
  const fb  = document.getElementById('feedback');
  fb.className = 'feedback wrong-fb';
  fb.style.display = 'block';

  let hintHtml = '';
  if (attempts === 1) {
    // First wrong: type-specific hint
    if (q.type === 'vocab' || q.type === 'fill') {
      hintHtml = `<div class="hint-box"><div class="hint-label">ヒント</div>最初の文字は「<b>${q.hint1c || q.a[0]}</b>」だよ</div>`;
    } else if (q.type === 'tf') {
      hintHtml = `<div class="hint-box"><div class="hint-label">ヒント</div>テキストをもう一度読んで、true か false を考えてみて</div>`;
    } else if (q.type === 'translate') {
      hintHtml = `<div class="hint-box"><div class="hint-label">ヒント</div>最初の単語は「<b>${q.a.split(' ')[0]}</b>」だよ</div>`;
    }
  } else if (attempts >= 2) {
    // Second+ wrong: reveal answer
    hintHtml = `<div class="hint-box"><div class="hint-label">正解はこれだよ</div><b>${q.a}</b></div>`;
  }

  fb.innerHTML = `
    <div class="fb-wrong">
      <div class="fb-result">❌ もう一回チャレンジ！</div>
      ${hintHtml}
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn-answer" onclick="retryAnswer()">再挑戦</button>
        <button class="btn-skip" onclick="nextQuestion()">次へ</button>
      </div>
    </div>
  `;
}

function showSkipFeedback() {
  const q  = questions[currentQIdx];
  const fb = document.getElementById('feedback');
  fb.className = 'feedback wrong-fb';
  fb.style.display = 'block';

  fb.innerHTML = `
    <div class="fb-wrong">
      <div class="fb-result">⏭ スキップ</div>
      <div class="hint-box"><div class="hint-label">正解</div><b>${q.a}</b></div>
      <button class="btn-next" onclick="nextQuestion()">次の問題へ ▶</button>
    </div>
  `;
}

function retryAnswer() {
  const q   = questions[currentQIdx];
  const inp = document.getElementById('q-input');
  inp.className = 'q-input';
  inp.disabled  = false;
  inp.value     = '';
  inp.focus();

  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  if (q.type === 'fill' && q.lineId) highlightLine(q.lineId);
}

function nextQuestion() {
  currentQIdx++;
  showQuestion();
}

// ══════════════════════════════════════════════
// TEXT HIGHLIGHT
// ══════════════════════════════════════════════

function highlightLine(lineId) {
  const el = document.getElementById('tl-' + lineId);
  if (el) {
    el.classList.add('highlight-line');
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function clearHighlight() {
  document.querySelectorAll('.highlight-line').forEach(el => {
    el.classList.remove('highlight-line');
  });
}

// ══════════════════════════════════════════════
// MEMO
// ══════════════════════════════════════════════

function clearMemo() {
  document.getElementById('memo-textarea').value = '';
}

// ══════════════════════════════════════════════
// COMPLETE SCREEN
// ══════════════════════════════════════════════

function showComplete() {
  document.getElementById('q-card').style.display = 'none';
  const cs = document.getElementById('complete-screen');
  cs.style.display = 'block';

  const pct = Math.round((score / questions.length) * 100);
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('progress-label').textContent = '全問完了！';

  let scoreColor = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--gold)' : 'var(--red)';
  document.getElementById('cs-score').innerHTML =
    `<span style="color:${scoreColor}">${score}</span><span style="font-size:1.5rem;color:var(--muted)">/${questions.length}</span>`;

  let msg = '';
  if (pct === 100) msg = '完璧！全問正解！すごすぎる！';
  else if (pct >= 80) msg = 'すばらしい！よく覚えられてるね！';
  else if (pct >= 60) msg = 'いい調子！もう一度やってみよう！';
  else msg = 'テキストをもう一度読んでみよう！';
  document.getElementById('cs-msg').textContent = msg;
}

function retryText() {
  loadText(currentTextIdx);
}

function nextText() {
  const next = (currentTextIdx + 1) % TEXTS.length;
  selectText(next);
}

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ══════════════════════════════════════════════
// STUDY MODE
// ══════════════════════════════════════════════

let studyWordIdx = 0;
let studyWords   = [];
let studiedTexts = {};

function showModeScreen(idx) {
  currentTextIdx = idx;
  const text = TEXTS[idx];
  document.getElementById('mode-text-label').textContent = text.title;

  const badge = document.getElementById('mode-studied-badge');
  badge.style.display = studiedTexts[idx] ? 'inline-block' : 'none';

  document.getElementById('mode-screen').style.display  = 'block';
  document.getElementById('fc-screen').style.display    = 'none';
  document.getElementById('study-overlay').style.display = 'flex';
}

function goToReading() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('study-overlay').style.display = 'none';
  loadText(currentTextIdx);
}

function startStudy() {
  studyWords   = STUDY_WORDS[currentTextIdx] || [];
  studyWordIdx = 0;

  document.getElementById('mode-screen').style.display     = 'none';
  document.getElementById('fc-word-card').style.display    = 'block';
  document.getElementById('fc-grammar-card').style.display = 'none';
  document.getElementById('fc-again-btn').style.display    = 'inline-block';
  document.getElementById('fc-next-btn').onclick           = nextFlashcard;
  document.getElementById('fc-screen').style.display       = 'flex';

  showFlashcard();
}

function showFlashcard() {
  const total = studyWords.length;
  if (studyWordIdx >= total) { showGrammarHint(); return; }

  const w   = studyWords[studyWordIdx];
  const pct = Math.round((studyWordIdx / total) * 100);

  document.getElementById('fc-progress-label').textContent = `${studyWordIdx + 1} / ${total} 単語`;
  document.getElementById('fc-bar-fill').style.width        = pct + '%';
  document.getElementById('fc-word').textContent            = w.en;
  document.getElementById('fc-kana').textContent            = w.kana;
  document.getElementById('fc-jp').textContent              = w.jp;

  const isLast = studyWordIdx === total - 1;
  document.getElementById('fc-next-btn').textContent =
    isLast ? '覚えた！文法ヒントへ →' : '覚えた！次へ →';

  setTimeout(() => speakWord(), 400);
}

function nextFlashcard() {
  studyWordIdx++;
  showFlashcard();
}

function speakWord() {
  if (studyWordIdx >= studyWords.length) return;
  const w = studyWords[studyWordIdx];
  if (!w || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(w.en);
  u.lang = 'en-US';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function showGrammarHint() {
  const hint = GRAMMAR_HINTS[currentTextIdx];
  if (!hint) { completeStudy(); return; }

  document.getElementById('fc-progress-label').textContent = '📐 文法ヒント';
  document.getElementById('fc-bar-fill').style.width        = '100%';

  document.getElementById('gc-title').textContent       = hint.title;
  document.getElementById('gc-example-en').textContent  = hint.exampleEn;
  document.getElementById('gc-translate').textContent   = hint.translate;
  document.getElementById('gc-point').textContent       = 'ポイント：' + hint.point;
  document.getElementById('gc-examples').innerHTML      = hint.examples;

  document.getElementById('fc-word-card').style.display    = 'none';
  document.getElementById('fc-grammar-card').style.display = 'block';
  document.getElementById('fc-again-btn').style.display    = 'none';

  const btn = document.getElementById('fc-next-btn');
  btn.textContent = '予習完了！長文を読もう！';
  btn.onclick     = completeStudy;
}

function completeStudy() {
  studiedTexts[currentTextIdx] = true;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    if (i === currentTextIdx) b.classList.add('studied');
  });
  goToReading();
}

// Enter key to submit
document.addEventListener('DOMContentLoaded', () => {
  init();
  document.getElementById('q-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkAnswer();
  });
});
