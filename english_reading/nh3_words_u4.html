<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語｜中3 Unit4以降の単語練習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root { --bg:#0d1117; --bg2:#161b22; --bg3:#1c2230; --gold:#f5c518; --red:#e94560; --blue:#1f6feb; --green:#3fb950; --text:#e6edf3; --text2:#8b949e; --border:#30363d; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:'Noto Serif JP',serif; font-size:16px; line-height:2; letter-spacing:0.04em; }
button { font-family:inherit; cursor:pointer; }
.top-nav { position:sticky; top:0; z-index:10; background:rgba(13,17,23,0.96); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.top-nav a { font-size:1.3rem; text-decoration:none; }
.nav-title { font-weight:bold; color:var(--gold); flex:1; min-width:0; font-size:15px; line-height:1.5; }
.nav-stat { font-size:13px; color:var(--text2); background:var(--bg3); border:1px solid var(--border); border-radius:999px; padding:2px 10px; white-space:nowrap; }
.nav-stat b { color:var(--gold); }
.wrap { max-width:720px; margin:0 auto; padding:14px 16px 80px; }
.notice { background:rgba(245,197,24,0.08); border:1px solid rgba(245,197,24,0.35); border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.9; color:#e8dcae; margin-bottom:12px; }
.warn { display:none; background:rgba(233,69,96,0.1); border:1px solid var(--red); border-radius:12px; padding:10px 14px; font-size:14px; margin-bottom:12px; }
#filters, #tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
.chip { background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:999px; padding:6px 14px; font-size:15px; line-height:1.4; }
.chip small { margin-left:6px; color:var(--text2); font-size:12px; }
.chip.on { background:var(--gold); color:#000; border-color:var(--gold); font-weight:bold; }
.chip.on small { color:#333; }
.chip.weak.on { background:var(--red); color:#fff; border-color:var(--red); }
.tab { flex:1; background:var(--bg2); color:var(--text2); border:1px solid var(--border); border-radius:12px; padding:10px 6px; font-size:16px; }
.tab.on { background:var(--blue); color:#fff; border-color:var(--blue); font-weight:bold; }
.hint { font-size:14px; color:var(--text2); background:var(--bg2); border-radius:10px; padding:10px 14px; margin:6px 0 12px; line-height:1.9; }
.empty { text-align:center; color:var(--text2); padding:40px 10px; }
h3.sec { color:var(--gold); font-size:16px; margin:22px 0 8px; border-left:4px solid var(--gold); padding-left:10px; }
.wcard { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin:10px 0; }
.wtop { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.wword { font-family:Georgia,'Times New Roman',serif; font-size:26px; font-weight:bold; letter-spacing:0.06em; color:#fff; line-height:1.4; word-break:break-word; }
.say { background:var(--bg3); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:4px 10px; font-size:16px; flex-shrink:0; }
.say.big { font-size:20px; padding:6px 12px; }
.tag { font-size:12px; border-radius:999px; padding:1px 8px; background:var(--bg3); color:var(--text2); border:1px solid var(--border); }
.tag.ok { color:var(--green); border-color:var(--green); }
.tag.ng { color:var(--red); border-color:var(--red); }
.tag.wk { color:#9cc7ff; border-color:#1f6feb; }
.myspell { font-size:14px; color:var(--text2); margin:2px 0 6px; }
.myspell s { color:#f87171; font-family:Georgia,serif; font-size:16px; }
.myspell b { color:var(--gold); font-family:Georgia,serif; font-size:16px; }
.wmean { font-size:17px; margin:6px 0; }
.pos { display:inline-block; font-size:12px; background:#1f3a5f; color:#9cc7ff; border-radius:6px; padding:0 6px; margin-right:8px; vertical-align:middle; }
.pron { color:var(--text2); font-size:14px; margin-left:6px; }
.chunks { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; align-items:flex-end; }
.ch { display:inline-flex; flex-direction:column; align-items:center; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:2px 8px; min-width:34px; transition:background .15s; }
.ch .cw { font-family:Georgia,'Times New Roman',serif; font-size:20px; color:var(--gold); line-height:1.5; }
.ch .ck { font-size:13px; color:#c9d1d9; line-height:1.5; }
.ch.trap .cw { text-decoration:underline dotted var(--red); text-decoration-thickness:2px; text-underline-offset:4px; }
.ch.lit { background:var(--gold); }
.ch.lit .cw, .ch.lit .ck { color:#000; }
.gap { width:10px; }
.wbtns { margin:4px 0 8px; }
.mini { background:none; border:1px solid var(--gold); color:var(--gold); border-radius:999px; padding:4px 14px; font-size:14px; }
.wex { display:flex; gap:10px; align-items:flex-start; background:rgba(255,255,255,0.03); border-radius:10px; padding:8px 10px; }
.exen { font-family:Georgia,'Times New Roman',serif; font-size:17px; line-height:1.8; }
.exjp { font-size:14px; color:var(--text2); line-height:1.8; }
.wpage { font-size:12px; color:var(--text2); margin-top:8px; }
.neta { margin-top:8px; }
.bub { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; background:rgba(255,255,255,0.04); border-radius:10px; padding:6px 10px; margin:6px 0; font-size:14px; line-height:1.9; }
.bub .face { font-size:15px; }
.bub .who { font-size:12px; color:var(--text2); }
.bub .txt { flex-basis:100%; }
.bub.k { border-left:3px solid var(--red); } .bub.n { border-left:3px solid var(--gold); } .bub.s { border-left:3px solid #2d6a4f; } .bub.r { border-left:3px solid #6d28d9; } .bub.i { border-left:3px solid #b45309; }
.lctl { display:flex; gap:10px; margin:10px 0; }
.big-btn { flex:1; background:var(--gold); color:#000; border:none; border-radius:14px; padding:14px; font-size:17px; font-weight:bold; }
.big-btn.sub { background:var(--bg3); color:var(--text); border:1px solid var(--border); font-weight:normal; }
.big-btn:disabled { opacity:0.4; }
.lset { font-size:14px; color:var(--text2); display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
.lprog, .qprog, .qstat { font-size:14px; color:var(--text2); margin:8px 0; }
.qtype { font-size:15px; color:var(--gold); margin:6px 0; }
.qword { display:flex; align-items:center; gap:12px; font-family:Georgia,'Times New Roman',serif; font-size:30px; font-weight:bold; margin:8px 0 12px; word-break:break-word; }
.qmean { font-size:17px; margin:4px 0 12px; }
.qchoices { display:flex; flex-direction:column; gap:10px; }
.qc { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:17px; text-align:left; line-height:1.6; }
.qc.en { font-family:Georgia,'Times New Roman',serif; font-size:20px; letter-spacing:0.06em; }
.qc.right { border-color:var(--green); background:rgba(63,185,80,0.15); }
.qc.wrong { border-color:var(--red); background:rgba(233,69,96,0.15); }
.qin { width:100%; font-family:Georgia,'Times New Roman',serif; font-size:22px; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--bg3); color:#fff; letter-spacing:0.06em; }
.hintcard { background:var(--bg2); border:1px dashed var(--gold); border-radius:12px; padding:8px 12px; font-size:15px; margin-top:6px; }
.fbwrap { margin-top:16px; }
.fb { font-size:20px; font-weight:bold; margin:6px 0; }
.fb.ok { color:var(--green); } .fb.ng { color:var(--red); }
.yours { font-size:15px; color:var(--text2); } .yours span { font-family:Georgia,serif; color:#f87171; font-size:18px; }
.result { text-align:center; padding:16px 0; }
.rbig { font-family:'Bebas Neue',sans-serif; font-size:56px; color:var(--gold); }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:var(--bg3); color:var(--text); border:1px solid var(--gold); border-radius:12px; padding:10px 16px; font-size:14px; opacity:0; transition:all .3s; pointer-events:none; max-width:90vw; z-index:20; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.xp-pop { position:fixed; right:20px; top:70px; color:var(--gold); font-weight:bold; font-size:20px; animation:pop 1s ease-out forwards; z-index:20; }
@keyframes pop { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-30px); } }
</style>
</head>
