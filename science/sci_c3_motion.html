<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>理科｜運動とエネルギー（中3）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/science.css">
<style>
/* このページだけの補い（文字を大きく・行間広く。science.css は他ページと共有なので触らない） */
.main { overflow-wrap: anywhere; }
.exp-card { font-size: 15px; }
.exp-card-title { font-size: 14px; }
.exp-rule, .exp-ok, .exp-ng, .exp-tip { display: block; margin: 6px 0; line-height: 2.0; font-size: 15px; }
.exp-rule .label { font-size: 13px; }
.q-text { line-height: 2.0; }
.mo-tbl { width: 100%; border-collapse: collapse; font-size: 15px; line-height: 1.9; margin: 10px 0; }
.mo-tbl th, .mo-tbl td { border: 1px solid var(--border); padding: 8px; text-align: left; vertical-align: middle; }
.mo-tbl th { color: var(--teal); background: rgba(14,165,233,0.07); }
.mo-tbl.center th, .mo-tbl.center td { text-align: center; }
.nw { white-space: nowrap; }
.mo-ok { color: #3ddc84; font-weight: bold; }
.mo-ng { color: #ff8a8a; font-weight: bold; }
.mo-big { font-size: 19px; font-weight: bold; color: #fff; background: rgba(245,197,24,0.12); border-left: 4px solid var(--gold); padding: 6px 12px; margin: 10px 0; border-radius: 6px; line-height: 1.9; }
.mo-step { margin: 10px 0; border: 2px solid var(--border); border-radius: 12px; background: rgba(255,255,255,0.03); }
.mo-step summary { cursor: pointer; padding: 12px 14px; font-size: 16px; font-weight: bold; color: var(--gold); line-height: 1.7; }
.mo-step[open] summary { border-bottom: 1px solid var(--border); }
.mo-body { padding: 12px 16px; font-size: 15px; line-height: 2.1; }
.mo-svg { margin: 8px 0 12px; }
.mo-svg svg { width: 100%; max-width: 380px; display: block; margin: 0 auto; }
.mo-exam { background: rgba(245,197,24,0.06); border: 1px solid rgba(245,197,24,0.4); border-radius: 12px; padding: 14px 16px; margin: 12px 0; font-size: 15px; line-height: 2.0; }
.mo-exam b { color: var(--gold); }
.practice-title { font-size: 16px; }
</style>
</head>
<body>

<nav class="top-nav">
  <a href="../index.html" title="ホームへ" style="font-size:1.3rem;text-decoration:none;flex-shrink:0;line-height:1;">🏠</a>
  <div class="nav-title">🎢 運動とエネルギー</div>
  <div class="section-tabs" id="sectionTabs"></div>
  <div class="coin-total" id="coinTotal">🪙 0 XP</div>
</nav>

<div class="xp-bar-wrap">
  <div class="xp-top-row">
    <div class="xp-badge" id="xpBadge">NSC入学</div>
    <div class="xp-rank"  id="xpLevel">Lv.1 🥚</div>
    <div class="xp-title" id="xpTitle">見習い研修生</div>
    <div class="xp-next"  id="xpNext">次の昇格まで 15 XP</div>
  </div>
  <div class="xp-status-row" id="xpStatus">きょん「物理？なにそれ食えるの？」</div>
  <div class="xp-bar"><div class="xp-fill" id="xpFill" style="width:0%"></div></div>
</div>

<div class="weak-bar">
  <span class="weak-bar-label">🔥 弱点TOP</span>
  <div id="weakItems" style="display:flex;flex-wrap:wrap;gap:6px;flex:1;align-items:center"></div>
</div>

<div class="main" id="mainContent"></div>
<div id="toast" class="toast"></div>
<div id="resultOverlay"></div>

<script src="../assets/js/sci_c3_motion.js?v=3" defer></script>
</body>
</html>
